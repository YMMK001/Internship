<body class="container">
    <header>
        <h1>CSS Utility Simulator</h1>

    <!--  Dropdown-->
    <div class="dropdown">
        <div class="utility">

            <h2>Utility Controls</h2>

            <label>Padding (Spacing)</label>
            <select value="Medium (p)" id="drop">
                <option value="Medium">Medium (p)</option>
            </select>

            <label>Background Theme (Colors)</label>
            <select value="Primary Blue" id="drop">
                <option value="Medium">Primary Blue</option>
            </select>

            <label>Text Size (Typography)</label>
            <select value="large (text-xl)" id="drop">
                <option value="Medium">large (text-xl)</option>
            </select>

            <label>Corner Radius (Borders)</label>
            <select value="Square (rounded-none)" id="drop">
                <option value="Medium">Square (rounded-none)</option>
            </select>

            <label>Shadow (Depth)</label>
            <select value="Medium (Shadow-md)" id="drop">
                <option value="Medium">Medium (Shadow-md)</option>
            </select>
        </div>

        <div class="postcard">
            <p>Alex Walker<br>
                Full-Stack Web Developer building <br>awesome things with Tailwind CSS</p>
        </div>
    </div>
