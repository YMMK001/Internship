<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    .herosection{
        display: flex;
        background-color: rgb(203, 230, 221);
        margin: auto;
        border-radius: 10px;
        width: 800px;
        
        height: 500px;
       box-shadow: 5px 5px 10px 0px rgba(0, 0, 0, 0.20);
    }
    
    .updatevariable{
        width: 100%;
        padding: 50px;
        display: flex;
        flex-direction: column;
        
        }
    .livedom{
        width: 100%;
        padding: 50px;
    }
    .card{
        border: solid;
        padding: 5px;
        border-radius: 5px;
    }
    label{
        font-weight: bold;
        font-size: 1.1em;        
    }
    input{
        
        padding: 6px;
        border-radius: 5px;
        border-style: groove;
    }
</style>
<body>    
    <section class="herosection">
        <section class="updatevariable">
            <h1>Update variables</h1>

            <label for="inputname">Name String:</label>
            <input type="text" value="text" id="input">

            <label for="inputage">Age:</label>
            <input type="number" value="age" id="input">

            <label>VIP Status(Boolean):</label>
            <input type="checkbox">

            <label>Color</label>
            <input type="color" value="green" >
        </section>

        <section class="livedom">
            <h1>Live DOM Output</h1>
           
            <section class="card">
                <p>VIP Member</p>
                <p>Name:fjj</p>
                <p>Age <span>23</span></p>
            </section>
        </section>
    </section>
</body>
</html>
